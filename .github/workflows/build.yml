name: Build and Deploy to CloudHub 2.0

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: '17'

      - name: Deploy to Exchange
        run: mvn deploy --settings .maven/settings.xml

      - name: Deploy to CloudHub
        run: |
          mvn deploy -DmuleDeploy \
            -Danypoint.client_id="${{ vars.ANYPOINTUSERNAME }}" \
            -Danypoint.client_secret="${{ vars.ANYPOINTPASSWORD }}" \
            -Denvironment="${{ vars.MULE_ENV }}" \
            -Dsecure_key="${{ secrets.MULE_KEY }}" \
            -Dtarget="${{ vars.MULE_TARGET }}" --settings .maven/settings.xml
